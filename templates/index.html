<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lyra AI</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../Styles/styles.css" />
	</head>
	<body>
		<canvas id="stars"></canvas>
		<div class="aurora one"></div>
		<div class="aurora two"></div>

		<div class="chat">
			<div class="header">
				<div class="header-top">
					<svg class="mark" viewBox="0 0 40 40" fill="none">
						<defs>
							<linearGradient id="markGrad" x1="0" y1="0" x2="40" y2="40">
								<stop offset="0%" stop-color="#a99dff" />
								<stop offset="100%" stop-color="#45d6c4" />
							</linearGradient>
						</defs>
						<path
							d="M10 32 L10 8 M30 32 L30 8 M10 8 C10 4 30 4 30 8"
							stroke="url(#markGrad)"
							stroke-width="2.4"
							stroke-linecap="round"
							fill="none"
						/>
						<line
							x1="14"
							y1="10"
							x2="14"
							y2="28"
							stroke="url(#markGrad)"
							stroke-width="1"
							opacity="0.6"
						/>
						<line
							x1="18"
							y1="9"
							x2="18"
							y2="29"
							stroke="url(#markGrad)"
							stroke-width="1"
							opacity="0.6"
						/>
						<line
							x1="22"
							y1="9"
							x2="22"
							y2="29"
							stroke="url(#markGrad)"
							stroke-width="1"
							opacity="0.6"
						/>
						<line
							x1="26"
							y1="10"
							x2="26"
							y2="28"
							stroke="url(#markGrad)"
							stroke-width="1"
							opacity="0.6"
						/>
						<circle cx="20" cy="6" r="2.2" fill="#f7c548" />
					</svg>
					<div>
						<h1>Lyra AI</h1>
						<small>Generative AI Assistant</small>
					</div>
				</div>
				<svg class="strings" viewBox="0 0 700 14" preserveAspectRatio="none">
					<defs>
						<linearGradient id="stringGradient" x1="0" y1="0" x2="1" y2="0">
							<stop offset="0%" stop-color="#7c6ff0" />
							<stop offset="50%" stop-color="#45d6c4" />
							<stop offset="100%" stop-color="#f7c548" />
						</linearGradient>
					</defs>
					<line x1="0" y1="2" x2="700" y2="2" />
					<line x1="0" y1="5" x2="700" y2="5" />
					<line x1="0" y1="8" x2="700" y2="8" />
					<line x1="0" y1="11" x2="700" y2="11" />
				</svg>
			</div>

			<div id="messages"></div>

			<div class="input-area">
				<input
					id="messageInput"
					type="text"
					placeholder="Talk to Lyra..."
					autocomplete="off"
				/>
				<button class="send" onclick="sendMessage()" aria-label="Send message">
					<svg viewBox="0 0 24 24" fill="none">
						<path d="M4 12L20 4L14 20L11 13L4 12Z" fill="white" />
					</svg>
				</button>
			</div>
		</div>
	</body>
</html>
